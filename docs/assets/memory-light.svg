<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="0" y="22" font-size="16" font-weight="600" fill="#1f2328">Resident memory, by number of open agent sessions</text>
<text x="0" y="43" font-size="12.5" fill="#59636e">An MCP server is one daemon per session, running whether or not you touch Jira that day.</text>
<text x="0" y="61" font-size="12.5" fill="#59636e">atl holds nothing between calls, so the number never grows.</text>
<rect x="128" y="70" width="11" height="11" rx="2.5" fill="#cf222e"/>
<text x="145" y="80" font-size="12.5" fill="#1f2328">mcp-atlassian</text>
