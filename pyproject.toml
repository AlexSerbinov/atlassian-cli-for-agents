[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atl-cli"
version = "0.1.0"
description = "Token-efficient Jira + Confluence Cloud CLI for AI coding agents — a drop-in replacement for the mcp-atlassian MCP server"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Oleksandr Serbinov" }]
keywords = ["jira", "confluence", "atlassian", "cli", "mcp", "llm", "agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AlexSerbinov/atl"
Issues = "https://github.com/AlexSerbinov/atl/issues"

[project.scripts]
atl = "atl:main"

[tool.setuptools]
py-modules = ["atl"]
